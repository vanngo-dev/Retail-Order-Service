name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Run tests
        run: mvn -B -ntp test

      - name: Package application
        run: mvn -B -ntp package

      - name: Verify packaged jar
        run: test -f target/retail-order-service-0.0.1-SNAPSHOT.jar
