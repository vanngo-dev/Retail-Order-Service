spring:
  application:
    name: retail-order-service
  datasource:
    url: jdbc:h2:mem:retail_order_service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: retail-order-service
    description: Retail order workflow API
    version: 0.0.1-SNAPSHOT
    phase: "9"
    diagnostics: health,info

logging:
  level:
    com.example.retailorderservice: INFO
